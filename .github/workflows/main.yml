# Коммент
# Это Название пайплаина
# ${{secrets.HARDCODEUSERPASSWD}}
# ${{vars.BACK_URL}}
name: newautotest UI/API
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

#ручной запуск 
  workflow_dispatch: 

jobs:
  homeworkPageObject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
      - name: Установить пакет
        run: npm ci
      - name: Установить браузеры
        run: npx playwright install --with-deps
      - name: Setup AllureCTL
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: https://allure.qa.guru
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: ${{ vars.ALLURE_PROJECT_ID }}  
      - name: Запустить тесты
        run: npm t
        env: 
          BACK_URL_API: ${{vars.BACK_URL_API}}
          BACK_URL: ${{vars.BACK_URL}}
          
      - name: Upload results to Allure TestOps
        id: launch_url 
        if: always()
        run: |
          # Получаем ID последнего запуска через API
          LAUNCH_ID=$(curl -s -H "Authorization: Api-Token ${{ secrets.ALLURE_TOKEN }}" \
            "https://allure.qa.guru/api/rs/project/${{ vars.ALLURE_PROJECT_ID }}/launch?page=0&size=1&sort=createdDate,desc" \
            | jq -r '.content[0].id')
    
          if [ -z "$LAUNCH_ID" ]; then
            LAUNCH_URL="https://allure.qa.guru/project${{ vars.ALLURE_PROJECT_ID }}"
          else
            LAUNCH_URL="https://allure.qa.guru/project//launch/$LAUNCH_ID"
          fi
    
          echo "launch_url=$LAUNCH_URL" >> $GITHUB_OUTPUT
        
      - name: Генерируем отчет для телеграмм 
        run: npx allure awesome ./allure-results
        continue-on-error: true
        if: always()
        
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        continue-on-error: true
        if: always()
        with: 
          name: artefacts
          path: |
            allure-report/index.html
            allure-results
            playwright-report
            allure-report-single

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
        if: always()
      
      - name: Отправить уведомление в Telegram
        run: java "-DconfigFile=notification/telegram.json" -jar notification/allure-notifications-5.0.8.jar
        env:
           TELEGRAM_BOT_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
           TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_CHAT_ID}}
           REPORT_URL: ${{steps.launch_url.outputs.launch_url}}
           BUILD_URL: ${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}
        if: always()  
        
